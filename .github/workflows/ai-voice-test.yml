name: ai-voice-test

on:
  push:
    paths:
      - "ai-voice-test/**"
      - ".github/workflows/ai-voice-test.yml"
  pull_request:
    paths:
      - "ai-voice-test/**"
      - ".github/workflows/ai-voice-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-voice-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-voice-test/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Local Worker + Durable Object WebSocket integration
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --port 8787 --ip 127.0.0.1 > /tmp/ai-voice-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true' EXIT

          READY=0
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8787/health > /tmp/ai-voice-health.json; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/ai-voice-wrangler.log
            exit 1
          fi

          npm run test:integration
