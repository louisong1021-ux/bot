name: ai-voice-test

on:
  push:
    paths:
      - "ai-voice-test/**"
      - ".github/workflows/ai-voice-test.yml"
  pull_request:
    paths:
      - "ai-voice-test/**"
      - ".github/workflows/ai-voice-test.yml"
  workflow_dispatch:

jobs:
  stage-a:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-voice-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-voice-test/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
