name: ChineseInLA → Notion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "chineseinla-notion/main.py"
      - "chineseinla-notion/runner.py"
      - "chineseinla-notion/requirements.txt"
      - ".github/workflows/chineseinla-notion.yml"

concurrency:
  group: chineseinla-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: chineseinla-notion/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r chineseinla-notion/requirements.txt

      - name: Run scraper and sync Notion
        run: python chineseinla-notion/runner.py
